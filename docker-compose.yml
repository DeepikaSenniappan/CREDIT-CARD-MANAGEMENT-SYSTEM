services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: credit_cards
      MYSQL_USER: credit_cards
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data: